name: movies_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  carousel_slider: ^5.1.2
  flutter_native_splash: ^2.4.7
  dio: ^5.7.0
  skeletonizer: ^2.1.3
  pretty_dio_logger: ^1.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/2x/
    - assets/icons/3x/
    - assets/
    - assets/images/
    - assets/images/MoviePosters/
    - assets/images/OnBoarding/
    - assets/images/ProfileAvatars/
    - assets/images/2x/
    - assets/images/3x/